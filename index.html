<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>一个没什么用的减重页面</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="weight-card" aria-labelledby="title">
        <header class="hero">
          <p class="kicker">tiny useless tool</p>
          <h1 id="title">一个没什么用的减重页面</h1>
          <p class="subtitle">只能减一点点精神重量，不能减体重。</p>
        </header>

        <div class="progress-row" aria-live="polite">
          <span id="progressText">已减轻 0%</span>
          <span class="progress-track" aria-hidden="true">
            <span class="progress-fill" id="progressFill"></span>
          </span>
          <div class="mini-stats" aria-hidden="true">
            <span class="stat-pill" id="softnessStat">软度 低</span>
            <span class="stat-pill" id="floatStat">漂浮 0cm</span>
            <span class="stat-pill" id="trustStat">可信度 不详</span>
          </div>
        </div>

        <div class="stage" id="stage">
          <div class="cloud-wrap" id="cloudWrap" aria-label="烦人的东西云朵" role="img">
            <span class="cloud-shadow" aria-hidden="true"></span>
            <svg class="cloud-svg" viewBox="0 0 320 220" aria-hidden="true">
              <defs>
                <linearGradient id="cloudGradient" x1="60" y1="40" x2="250" y2="180" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#fffdf8" />
                  <stop offset="1" stop-color="#eaf9ff" />
                </linearGradient>
              </defs>
              <g class="cloud-body">
                <path class="cloud-shape" d="M74 151 C48 151 29 132 29 108 C29 83 49 64 76 66 C87 42 112 29 142 34 C168 38 187 54 195 78 C214 67 239 70 254 87 C273 109 267 142 243 154 C235 158 225 160 214 159 L84 159 C80 159 76 156 74 151 Z" />
                <path class="cloud-soft-line" d="M76 154 C110 164 202 164 237 153" />
                <path class="cloud-highlight" d="M88 76 C101 49 143 44 171 62" />
              </g>
              <g class="cloud-face">
                <g class="face face-calm">
                  <path class="eye" d="M119 112 C124 106 132 106 137 112" />
                  <path class="eye" d="M184 112 C189 106 197 106 202 112" />
                  <path class="mouth" d="M147 126 C155 137 168 137 176 126" />
                </g>
                <g class="face face-smile">
                  <path class="eye" d="M116 107 C123 118 134 118 141 107" />
                  <path class="eye" d="M180 107 C187 118 198 118 205 107" />
                  <path class="mouth" d="M144 124 C154 142 170 142 180 124" />
                </g>
                <g class="face face-relief">
                  <path class="eye" d="M116 111 C124 115 133 115 141 111" />
                  <path class="eye" d="M180 111 C188 115 197 115 205 111" />
                  <path class="mouth" d="M149 127 C156 134 167 134 174 127" />
                </g>
                <g class="face face-dizzy">
                  <path class="eye" d="M119 105 L137 118 M137 105 L119 118" />
                  <path class="eye" d="M184 105 L202 118 M202 105 L184 118" />
                  <path class="mouth" d="M151 130 C157 124 168 124 174 130" />
                </g>
                <g class="face face-light">
                  <circle class="dot-eye" cx="128" cy="111" r="4" />
                  <circle class="dot-eye" cx="193" cy="111" r="4" />
                  <path class="mouth" d="M148 127 C156 139 168 139 176 127" />
                </g>
                <g class="eyes-open">
                  <path d="M119 112 C124 106 132 106 137 112" />
                  <path d="M184 112 C189 106 197 106 202 112" />
                </g>
                <g class="eyes-blink">
                  <path d="M118 111 C126 114 133 114 139 111" />
                  <path d="M183 111 C191 114 198 114 204 111" />
                </g>
                <circle class="cheek" cx="103" cy="125" r="7" />
                <circle class="cheek" cx="216" cy="125" r="7" />
              </g>
              <text class="cloud-label" x="160" y="94" text-anchor="middle">烦人东西</text>
            </svg>
            <div class="final-star" id="finalStar" aria-hidden="true">✦</div>
          </div>

          <div class="speech-bubble" id="speechBubble" aria-live="polite">
            检测到烦人东西，正在假装处理。
          </div>

          <div class="particle-layer" id="particleLayer" aria-hidden="true"></div>
        </div>

        <div class="controls" id="controls" aria-label="减轻操作">
          <button class="control-button" type="button" data-action="rub">揉一下</button>
          <button class="control-button" type="button" data-action="blow">吹走一点</button>
          <button class="control-button" type="button" data-action="lighten">变轻一点</button>
          <button class="control-button" type="button" data-action="pretend">假装没事</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
