<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>一只路过的小狗</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="pet-card" aria-labelledby="title">
        <header class="hero">
          <div>
            <p class="kicker">little-web-pet</p>
            <h1 id="title">一只路过的小狗</h1>
            <p class="subtitle">点它一下，它可能会认真胡说八道。</p>
          </div>
          <div class="counter" aria-live="polite">已被戳 <span id="clickCount">0</span> 次</div>
        </header>

        <div class="stage" id="stage">
          <div class="speech-bubble" id="speechBubble" aria-live="polite">
            今日建议：少内耗，多吃饭。
          </div>

          <button class="dog-button expression-normal" id="dogButton" type="button" aria-label="戳一下小狗" aria-describedby="speechBubble">
            <span class="dog-shadow" aria-hidden="true"></span>
            <svg class="line-dog" viewBox="0 0 260 260" role="img" aria-label="代码绘制的白色线条小狗">
              <g class="dog-float">
                <g class="tail">
                  <path d="M198 151 C219 142 226 157 214 166 C205 173 196 166 204 158" />
                </g>

                <g class="body">
                  <path class="fill-white body-blob" d="M74 76 C89 48 168 47 185 76 C197 98 195 112 190 130 C207 143 210 170 195 184 C188 190 179 190 172 184 C175 204 169 222 152 224 C143 226 136 222 130 217 C124 222 116 226 107 224 C90 222 84 204 88 184 C81 190 72 190 65 184 C50 170 53 143 70 130 C65 112 62 98 74 76 Z" />
                  <path class="belly-line" d="M91 212 C109 224 151 224 169 212" />
                </g>

                <g class="left-arm paw">
                  <path class="fill-white" d="M73 121 C53 125 43 141 48 158 C52 171 64 174 72 164 C78 156 78 141 75 127" />
                  <path d="M55 145 C60 141 65 141 70 146" />
                  <path d="M55 154 C61 150 66 151 70 157" />
                </g>

                <g class="right-arm paw">
                  <path class="fill-white" d="M187 121 C207 125 217 141 212 158 C208 171 196 174 188 164 C182 156 182 141 185 127" />
                  <path d="M205 145 C200 141 195 141 190 146" />
                  <path d="M205 154 C199 150 194 151 190 157" />
                </g>

                <g class="head">
                  <g class="ear left-ear">
                    <path class="fill-white" d="M75 86 C60 73 43 81 43 100 C43 114 54 124 70 121" />
                  </g>
                  <g class="ear right-ear">
                    <path class="fill-white" d="M185 86 C200 73 217 81 217 100 C217 114 206 124 190 121" />
                  </g>

                  <path class="cheek left-cheek" d="M68 130 C59 136 56 145 60 153" />
                  <path class="cheek right-cheek" d="M192 130 C201 136 204 145 200 153" />

                  <g class="eyes eyes-normal">
                    <path d="M98 105 C103 96 113 96 118 105" />
                    <path d="M142 105 C147 96 157 96 162 105" />
                  </g>
                  <g class="eyes eyes-happy">
                    <path d="M96 101 C103 111 114 111 121 101" />
                    <path d="M139 101 C146 111 157 111 164 101" />
                  </g>
                  <g class="eyes eyes-comfy">
                    <path d="M96 105 C104 109 113 109 121 105" />
                    <path d="M139 105 C147 109 156 109 164 105" />
                  </g>
                  <g class="eyes eyes-focus">
                    <circle cx="109" cy="105" r="4.2" />
                    <circle cx="151" cy="105" r="4.2" />
                  </g>
                  <g class="eyes eyes-daze">
                    <path d="M101 99 L115 110" />
                    <path d="M115 99 L101 110" />
                    <path d="M145 99 L159 110" />
                    <path d="M159 99 L145 110" />
                  </g>

                  <g class="blink-lines">
                    <path d="M96 105 C104 108 113 108 121 105" />
                    <path d="M139 105 C147 108 156 108 164 105" />
                  </g>

                  <g class="muzzle">
                    <circle class="dot" cx="113" cy="124" r="2.8" />
                    <circle class="dot" cx="147" cy="124" r="2.8" />
                    <path class="nose" d="M123 118 C128 115 135 115 139 118 C138 126 124 126 123 118 Z" />
                    <path class="mouth mouth-normal" d="M131 126 C131 136 121 137 117 130 M131 126 C131 136 141 137 145 130" />
                    <path class="mouth mouth-happy" d="M116 130 C123 145 139 145 146 130" />
                    <path class="mouth mouth-work" d="M120 133 L143 133" />
                    <path class="mouth mouth-daze" d="M126 133 C130 128 136 128 140 133 C136 139 130 139 126 133 Z" />
                  </g>
                </g>
              </g>
            </svg>
            <span class="working-label" aria-hidden="true">working<span></span></span>
          </button>

          <div class="particle-layer" id="particleLayer" aria-hidden="true"></div>
        </div>

        <div class="controls" aria-label="桌宠操作">
          <button class="control-button" id="petButton" type="button">摸摸它</button>
          <button class="control-button" id="workButton" type="button">让它打工</button>
          <button class="control-button" id="phraseButton" type="button">换一句</button>
        </div>

        <p class="footer-note">如果它有点好笑，那它就算没白营业。</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
