<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>一只路过的小狗</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="pet-card" aria-labelledby="title">
        <header class="hero">
          <div>
            <p class="kicker">little-web-pet</p>
            <h1 id="title">一只路过的小狗</h1>
            <p class="subtitle">点它一下，它可能会认真胡说八道。</p>
          </div>
          <div class="counter" aria-live="polite">已被戳 <span id="clickCount">0</span> 次</div>
        </header>

        <div class="stage" id="stage">
          <div class="speech-bubble" id="speechBubble" aria-live="polite">
            今日建议：少内耗，多吃饭。
          </div>

          <button class="dog-button expression-normal" id="dogButton" type="button" aria-label="戳一下小狗" aria-describedby="speechBubble">
            <span class="dog-shadow" aria-hidden="true"></span>
            <svg class="line-dog" viewBox="0 0 260 260" role="img" aria-label="代码绘制的白色线条小狗">
              <g class="dog-float">
                <g class="tail">
                  <path d="M178 167 C200 160 202 181 181 179" />
                </g>

                <g class="body">
                  <path class="fill-white body-blob" d="M91 142 C80 157 77 197 92 214 C105 229 154 229 168 214 C183 197 180 157 169 142 C154 132 106 132 91 142 Z" />
                  <path class="belly-line" d="M101 213 C116 221 145 221 159 213" />
                </g>

                <g class="left-arm paw">
                  <path d="M91 164 C75 164 72 181 88 184" />
                  <path d="M86 181 C82 186 77 188 72 186" />
                </g>

                <g class="right-arm paw">
                  <path d="M169 164 C185 164 188 181 172 184" />
                  <path d="M174 181 C178 186 183 188 188 186" />
                  <circle class="collar-dot" cx="181" cy="165" r="5" />
                </g>

                <g class="head">
                  <g class="ear left-ear">
                    <path class="fill-white" d="M82 79 C67 68 52 75 50 92 C47 108 61 115 75 105" />
                  </g>
                  <g class="ear right-ear">
                    <path class="fill-white" d="M178 79 C193 68 208 75 210 92 C213 108 199 115 185 105" />
                  </g>

                  <path class="fill-white face" d="M76 82 C88 57 169 57 184 82 C197 105 189 134 166 145 C145 154 113 154 94 145 C71 134 63 105 76 82 Z" />
                  <path class="sketch-gap" d="M92 73 C111 62 150 62 169 73" />
                  <path class="cheek left-cheek" d="M78 126 C69 129 65 136 67 144" />
                  <path class="cheek right-cheek" d="M182 126 C191 129 195 136 193 144" />

                  <g class="eyes eyes-normal">
                    <path d="M100 102 C105 108 114 108 119 102" />
                    <path d="M141 102 C146 108 155 108 160 102" />
                  </g>
                  <g class="eyes eyes-happy">
                    <path d="M96 101 C103 111 114 111 121 101" />
                    <path d="M139 101 C146 111 157 111 164 101" />
                  </g>
                  <g class="eyes eyes-comfy">
                    <path d="M96 105 C104 109 113 109 121 105" />
                    <path d="M139 105 C147 109 156 109 164 105" />
                  </g>
                  <g class="eyes eyes-focus">
                    <circle cx="110" cy="104" r="3.5" />
                    <circle cx="150" cy="104" r="3.5" />
                  </g>
                  <g class="eyes eyes-daze">
                    <path d="M101 99 L115 110" />
                    <path d="M115 99 L101 110" />
                    <path d="M145 99 L159 110" />
                    <path d="M159 99 L145 110" />
                  </g>

                  <g class="blink-lines">
                    <path d="M96 105 C104 108 113 108 121 105" />
                    <path d="M139 105 C147 108 156 108 164 105" />
                  </g>

                  <g class="muzzle">
                    <circle class="dot" cx="112" cy="119" r="2.6" />
                    <circle class="dot" cx="148" cy="119" r="2.6" />
                    <path class="nose" d="M126 117 C129 115 134 115 137 117 C136 123 127 123 126 117 Z" />
                    <path class="mouth mouth-normal" d="M131 124 C131 131 123 132 120 127 M131 124 C131 131 139 132 142 127" />
                    <path class="mouth mouth-happy" d="M120 127 C126 137 137 137 143 127" />
                    <path class="mouth mouth-work" d="M121 128 L141 128" />
                    <path class="mouth mouth-daze" d="M127 129 C131 125 136 125 139 129 C136 134 131 134 127 129 Z" />
                  </g>
                </g>

                <g class="feet">
                  <path d="M101 218 C96 224 86 224 82 217" />
                  <path d="M158 218 C164 224 174 224 178 217" />
                </g>
              </g>
            </svg>
            <span class="working-label" aria-hidden="true">working<span></span></span>
          </button>

          <div class="particle-layer" id="particleLayer" aria-hidden="true"></div>
        </div>

        <div class="controls" aria-label="桌宠操作">
          <button class="control-button" id="petButton" type="button">摸摸它</button>
          <button class="control-button" id="workButton" type="button">让它打工</button>
          <button class="control-button" id="phraseButton" type="button">换一句</button>
        </div>

        <p class="footer-note">如果它有点好笑，那它就算没白营业。</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
