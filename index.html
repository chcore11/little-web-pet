<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>一个没什么用的减重页面</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="weight-card" aria-labelledby="title">
        <header class="hero">
          <p class="kicker">tiny useless tool</p>
          <h1 id="title">一个没什么用的减重页面</h1>
          <p class="subtitle">只能减一点点精神重量，不能减体重。</p>
        </header>

        <div class="progress-row" aria-live="polite">
          <span id="progressText">已减轻 0%</span>
          <span class="progress-track" aria-hidden="true">
            <span class="progress-fill" id="progressFill"></span>
          </span>
        </div>

        <div class="stage" id="stage">
          <div class="cloud-wrap" id="cloudWrap" aria-label="烦人的东西云朵" role="img">
            <span class="cloud-shadow" aria-hidden="true"></span>
            <svg class="cloud-svg" viewBox="0 0 320 220" aria-hidden="true">
              <defs>
                <linearGradient id="cloudGradient" x1="60" y1="40" x2="250" y2="180" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#fffdf8" />
                  <stop offset="1" stop-color="#eaf9ff" />
                </linearGradient>
              </defs>
              <g class="cloud-body">
                <path class="cloud-shape" d="M83 154 C48 154 31 132 37 105 C42 82 62 70 84 74 C94 46 121 31 151 38 C174 43 190 58 198 79 C222 67 252 77 265 100 C283 131 260 160 222 160 L88 160 C86 160 84 160 83 154 Z" />
                <path class="cloud-soft-line" d="M78 155 C109 167 199 169 233 155" />
              </g>
              <g class="cloud-face">
                <g class="eyes-open">
                  <path d="M119 112 C124 106 132 106 137 112" />
                  <path d="M184 112 C189 106 197 106 202 112" />
                </g>
                <g class="eyes-blink">
                  <path d="M118 111 C126 114 133 114 139 111" />
                  <path d="M183 111 C191 114 198 114 204 111" />
                </g>
                <path class="mouth" d="M147 126 C155 137 168 137 176 126" />
                <circle class="cheek" cx="103" cy="125" r="7" />
                <circle class="cheek" cx="216" cy="125" r="7" />
              </g>
              <text class="cloud-label" x="160" y="94" text-anchor="middle">烦人东西</text>
            </svg>
            <div class="final-star" id="finalStar" aria-hidden="true">✦</div>
          </div>

          <div class="speech-bubble" id="speechBubble" aria-live="polite">
            检测到烦人东西，正在假装处理。
          </div>

          <div class="particle-layer" id="particleLayer" aria-hidden="true"></div>
        </div>

        <div class="controls" id="controls" aria-label="减轻操作">
          <button class="control-button" type="button" data-action="rub">揉一下</button>
          <button class="control-button" type="button" data-action="blow">吹走一点</button>
          <button class="control-button" type="button" data-action="lighten">变轻一点</button>
          <button class="control-button" type="button" data-action="pretend">假装没事</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
